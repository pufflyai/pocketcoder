{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    {{- include "pocketcoder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pocketcoder.selector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    # Workspaces reach only the agent listener.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "pocketcoder.workspaceNamespace" . }}
      ports:
        - port: agent
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
