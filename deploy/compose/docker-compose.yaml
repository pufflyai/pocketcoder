# Local server with embedded PGlite. Keep controller data separate from workspace mounts.
services:
  server:
    profiles: ["full"]
    image: ${POCKETCODER_SERVER_IMAGE:-pocketcoder-server:dev}
    build:
      context: ../..
      dockerfile: deploy/image/server.Dockerfile
    environment:
      POCKETCODER_HOST: 0.0.0.0
      POCKETCODER_PORT: "7080"
      POCKETCODER_DIR: /var/lib/pocketcoder-controller/pc_data
      POCKETCODER_AUTH_PEPPER: ${POCKETCODER_AUTH_PEPPER:-}
      POCKETCODER_TEMPLATE_DIR: /etc/pocketcoder/templates
      POCKETCODER_DRIVER: docker
      POCKETCODER_STORAGE_BACKEND: filesystem
      POCKETCODER_INPUT_DIR: ${POCKETCODER_HOST_DATA_ROOT:-/tmp/pocketcoder-data}/input
      POCKETCODER_WORKSPACE_DATA_DIR: ${POCKETCODER_HOST_DATA_ROOT:-/tmp/pocketcoder-data}/workspaces
      POCKETCODER_CHECKPOINT_DIR: ${POCKETCODER_HOST_DATA_ROOT:-/tmp/pocketcoder-data}/checkpoints
      POCKETCODER_WORKSPACE_SERVER_URL: http://host.docker.internal:7080
    ports:
      - "127.0.0.1:7080:7080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pocketcoder-data:/var/lib/pocketcoder-controller
      - /var/run/docker.sock:/var/run/docker.sock
      # Local demo only; production deployments mount their own reviewed manifests.
      - ../../examples/templates:/etc/pocketcoder/templates:ro
      # The host daemon resolves child-container bind paths. Keep this
      # absolute source and target identical.
      - ${POCKETCODER_HOST_DATA_ROOT:-/tmp/pocketcoder-data}:${POCKETCODER_HOST_DATA_ROOT:-/tmp/pocketcoder-data}
    restart: unless-stopped

volumes:
  pocketcoder-data:
