apiVersion: v1
kind: ServiceAccount
metadata:
  name: pocketcoder-pi-gateway
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketcoder-pi-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pocketcoder-pi-gateway
  template:
    metadata:
      labels:
        app: pocketcoder-pi-gateway
    spec:
      serviceAccountName: pocketcoder-pi-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/OWNER/REPOSITORY/pi-gateway
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pocketcoder-pi-gateway-session
                  key: openai-api-key
            - name: PI_GATEWAY_BEARER
              valueFrom:
                secretKeyRef:
                  name: pocketcoder-pi-gateway-session
                  key: bearer
            - name: PI_GATEWAY_EXPIRES_AT
              valueFrom:
                secretKeyRef:
                  name: pocketcoder-pi-gateway-session
                  key: expires-at
            - name: PI_GATEWAY_ALLOWED_MODEL
              value: REPLACE_PI_GATEWAY_MODEL
            - name: PI_GATEWAY_MAX_OUTPUT_TOKENS
              value: "4096"
            - name: PI_GATEWAY_MAX_REQUEST_BYTES
              value: "2097152"
            - name: PI_GATEWAY_MAX_TOTAL_REQUEST_BYTES
              value: "16777216"
            - name: PI_GATEWAY_MAX_REQUESTS
              value: "50"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: pocketcoder-pi-gateway
spec:
  type: ClusterIP
  selector:
    app: pocketcoder-pi-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pocketcoder-pi-gateway
spec:
  podSelector:
    matchLabels:
      app: pocketcoder-pi-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: pocketcoder.dev/workspace-id
                operator: Exists
      ports:
        - protocol: TCP
          port: 8080
