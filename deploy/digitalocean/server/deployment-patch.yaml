apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketcoder-server
spec:
  template:
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POCKETCODER_DATABASE_SCHEMA
              value: pocketcoder
            - name: POCKETCODER_WORKSPACE_SERVER_URL
              value: http://pocketcoder-server.pocketcoder.svc.cluster.local:7080
