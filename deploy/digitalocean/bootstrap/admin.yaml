apiVersion: v1
kind: Pod
metadata:
  name: pocketcoder-admin
spec:
  restartPolicy: Never
  serviceAccountName: pocketcoder-controller
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: admin
      image: ghcr.io/OWNER/REPOSITORY/server:VERSION
      command: ["sleep", "900"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      env:
        - name: POCKETCODER_DIR
          value: /var/lib/pocketcoder-controller/pc_data
      volumeMounts:
        - name: controller-data
          mountPath: /var/lib/pocketcoder-controller
  volumes:
    - name: controller-data
      persistentVolumeClaim:
        claimName: pocketcoder-data
