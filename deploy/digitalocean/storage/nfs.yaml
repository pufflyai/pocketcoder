apiVersion: v1
kind: PersistentVolume
metadata:
  name: pocketcoder-digitalocean-nfs
  labels:
    pocketcoder.dev/storage: digitalocean-nfs
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nconnect=8
  nfs:
    server: REPLACE_NFS_PRIVATE_IP
    path: REPLACE_NFS_EXPORT_PATH
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocketcoder-workspaces
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  selector:
    matchLabels:
      pocketcoder.dev/storage: digitalocean-nfs
