# Shared HTTPS edge for account API hosts and public views. It terminates TLS with
# each account's own certificate and forwards to that account's controller only.
apiVersion: v1
kind: Namespace
metadata:
  name: pocketcoder-edge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: pocketcoder-edge
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pocketcoder-edge
rules:
  - apiGroups: [""]
    resources: [services, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pocketcoder-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pocketcoder-edge
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: pocketcoder-edge
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: pocketcoder
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: pocketcoder-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik
      nodeSelector:
        pocketcoder.dev/pool: system
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: docker.io/library/traefik:v3.7.14@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
          args:
            # Only HTTPS is published. Access logs stay off because one-time view URLs carry tokens.
            - --entryPoints.websecure.address=:8443/tcp
            - --entryPoints.websecure.http.tls=true
            # Reject X_Forwarded_Host-style aliases so clients cannot spoof the forwarding headers.
            - --entryPoints.websecure.http.aliasHeadersStrategy=reject
            - --entryPoints.traefik.address=:8080/tcp
            - --ping=true
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=pocketcoder
            - --providers.kubernetesingress.ingressendpoint.publishedservice=pocketcoder-edge/traefik
            - --global.checknewversion=false
            - --global.sendanonymoususage=false
            - --log.level=INFO
          ports:
            - name: websecure
              containerPort: 8443
            - name: ping
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ping
              port: ping
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: ping
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: pocketcoder-edge
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: REPLACE_LOAD_BALANCER_NAME
    service.beta.kubernetes.io/do-loadbalancer-protocol: tcp
    service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: traefik
  loadBalancerSourceRanges:
    - REPLACE_ALLOWED_SOURCE_CIDR
  ports:
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
