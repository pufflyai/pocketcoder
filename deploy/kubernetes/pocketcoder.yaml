apiVersion: v1
kind: ServiceAccount
metadata:
  name: pocketcoder-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pocketcoder-workspace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pocketcoder-controller
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pocketcoder-controller
subjects:
  - kind: ServiceAccount
    name: pocketcoder-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pocketcoder-controller
---
# Replace the storage class/size as needed. Multi-node clusters should use an
# RWX-capable class because the server and workspace Jobs mount the same claim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocketcoder-workspaces
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketcoder-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pocketcoder-server
  template:
    metadata:
      labels:
        app: pocketcoder-server
    spec:
      serviceAccountName: pocketcoder-controller
      securityContext:
        fsGroup: 10001
      containers:
        - name: server
          image: ghcr.io/OWNER/REPOSITORY/server:VERSION
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7080
          env:
            - name: POCKETCODER_HOST
              value: "0.0.0.0"
            - name: POCKETCODER_PORT
              value: "7080"
            - name: POCKETCODER_DRIVER
              value: kubernetes
            - name: POCKETCODER_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POCKETCODER_KUBERNETES_SERVICE_ACCOUNT
              value: pocketcoder-workspace
            - name: POCKETCODER_STORAGE_BACKEND
              value: kubernetes-pvc
            - name: POCKETCODER_KUBERNETES_WORKSPACE_CLAIM
              value: pocketcoder-workspaces
            - name: POCKETCODER_KUBERNETES_WORKSPACE_SUBPATH
              value: workspaces
            - name: POCKETCODER_WORKSPACE_DATA_DIR
              value: /var/lib/pocketcoder/workspaces
            - name: POCKETCODER_CHECKPOINT_DIR
              value: /var/lib/pocketcoder/checkpoints
            - name: POCKETCODER_TEMPLATE_DIR
              value: /etc/pocketcoder/templates
            - name: POCKETCODER_SECRET_PROVIDER
              value: kubernetes
            - name: POCKETCODER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pocketcoder-server
                  key: database-url
            - name: POCKETCODER_AUTH_PEPPER
              valueFrom:
                secretKeyRef:
                  name: pocketcoder-server
                  key: auth-pepper
          readinessProbe:
            httpGet:
              path: /livez
              port: http
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/pocketcoder
            - name: templates
              mountPath: /etc/pocketcoder/templates
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocketcoder-workspaces
        - name: templates
          configMap:
            name: pocketcoder-templates
---
apiVersion: v1
kind: Service
metadata:
  name: pocketcoder-server
spec:
  selector:
    app: pocketcoder-server
  ports:
    - name: http
      port: 7080
      targetPort: http
