          - "packages/contracts/**"
          - "packages/runtime-contracts/**"
"database":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/db/**"
          - "scripts/build-pglite-seed.ts"
          - "scripts/upgrade/**"
"drivers":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/drivers/**"
"egress":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/egress/**"
"manager":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/manager/**"
"remote":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/remote/**"
"runtime":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/runtime-core/**"
"sdk":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/sdk/**"
"server":
  - changed-files:
