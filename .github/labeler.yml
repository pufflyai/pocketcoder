# Only labels defined here are managed by the PR area labeler.
"auth":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/auth/**"
"cli":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/cli/**"
          - "examples/native/**"
          - "scripts/native-startup*.ts"
