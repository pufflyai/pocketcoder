          - ".pstdio/**"
"area:tooling":
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/**"
          - ".changeset/**"
          - "package.json"
          - "bun.lock"
          - "bunfig.toml"
          - "lerna.json"
          - "nx.json"
          - "tsconfig*.json"
          - "biome*.json"
          - "knip.jsonc"
          - ".env.example"
          - ".gitignore"
          - ".dockerignore"
          - ".editorconfig"
          - ".npmrc"
          - "license-clarifications.json"
