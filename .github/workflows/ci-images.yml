name: Published image qualification
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  images:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: images
      - uses: docker/setup-buildx-action@v3
      - run: bun build packages/supervisor/src/index.ts --target bun --outdir deploy/image/dist
      - name: Build workspace for the native architecture
        uses: docker/build-push-action@v6
        with:
          context: deploy/image
          file: deploy/image/Dockerfile
          load: true
          tags: pocketcoder-ci-workspace:${{ github.sha }}
          cache-from: type=gha,scope=workspace-${{ matrix.arch }}
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name ==
            'workflow_dispatch') && github.ref == 'refs/heads/main' && format('type=gha,scope=workspace-{0},mode=max',
            matrix.arch) || '' }}
      - name: Build server for the native architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/image/server.Dockerfile
          load: true
          tags: pocketcoder-ci-server:${{ github.sha }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name ==
            'workflow_dispatch') && github.ref == 'refs/heads/main' && format('type=gha,scope=server-{0},mode=max',
            matrix.arch) || '' }}
      - name: Build egress for the native architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/egress/Dockerfile
          load: true
          tags: pocketcoder-ci-egress:${{ github.sha }}
          cache-from: type=gha,scope=egress-${{ matrix.arch }}
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name ==
            'workflow_dispatch') && github.ref == 'refs/heads/main' && format('type=gha,scope=egress-{0},mode=max',
            matrix.arch) || '' }}
      - name: Run the bundled server CLI and workspace tools
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          docker run --rm --entrypoint bun "pocketcoder-ci-server:$SOURCE_SHA" /opt/pocketcoder/pcd.js --help

          docker run --rm --entrypoint agentapi "pocketcoder-ci-workspace:$SOURCE_SHA" --version

          docker run --rm --entrypoint bun "pocketcoder-ci-workspace:$SOURCE_SHA" -e "await
          import('/opt/pocketcoder/supervisor.js')"
      - name: Prove private egress admission and capability removal in the built image
        env:
          POCKETCODER_EGRESS_CONFORMANCE_IMAGE: pocketcoder-ci-egress:${{ github.sha }}
        run: bun test packages/drivers/src/docker/docker-egress-conformance.test.ts
