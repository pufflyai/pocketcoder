name: release images
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Release tag whose scanned candidate images get version tags, for example v0.9.0
        required: true
        type: string
      latest:
        description: Also point latest at this release
        type: boolean
        default: true
permissions: {}
env:
  BUN_VERSION: 1.4.2
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the release's candidate images with its version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          LATEST: ${{ inputs.latest }}
        run: bun run images:release "$RELEASE_TAG" "$IMAGE_REPOSITORY" $([ "$LATEST" = "true" ] || echo --no-latest)
# Separate from candidate images, whose runs cancel each other per branch.
concurrency:
  group: release-images
  cancel-in-progress: false
