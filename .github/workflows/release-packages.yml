name: Release Packages
on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
  workflow_dispatch: {}
concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
  pull-requests: write
  actions: read
env:
  BUN_VERSION: 1.4.2
jobs:
  release:
    name: Version or publish packages
    if: (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify the exact successful CI revision
        id: revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_PUBLISH_BRANCH: main
        run: bun --no-env-file scripts/ci/publication.ts
      - name: Reuse the exact validated package build
        if: github.event_name == 'workflow_run' && steps.revision.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ci-build-${{ github.event.workflow_run.head_sha || github.sha }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Build and verify a manual publication
        if: github.event_name == 'workflow_dispatch' && steps.revision.outputs.publish == 'true'
        run: |-
          bun run build
          bun run pack:check
      - name: Create version PR or publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore: version packages"
          title: "chore: version packages"
          version: bun run version-packages
          publish: bun x changeset publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.revision.outputs.publish == 'true'
      - name: Tag the matching container release
        if: steps.changesets.outputs.published == 'true'
        run: |
          version="$(bun -e 'console.log(require("./packages/cli/package.json").version)')"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" --message "PocketCoder ${tag}"
          git push origin "$tag"
