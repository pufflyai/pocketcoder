name: Release Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  BUN_VERSION: 1.3.14

jobs:
  release:
    name: Version or publish packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pocketcoder
          POSTGRES_PASSWORD: pocketcoder
          POSTGRES_DB: pocketcoder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pocketcoder"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run check

      - name: Typecheck packages
        run: bun run typecheck

      - name: Test packages
        run: bun run test
        env:
          POCKETCODER_TEST_DATABASE_URL: postgres://pocketcoder:pocketcoder@127.0.0.1:5432/pocketcoder

      - name: Build packages
        run: bun run build

      - name: Verify npm package contents
        run: bun run pack:check

      - name: Create version PR or publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore: version packages"
          title: "chore: version packages"
          version: bun run version-packages
          publish: bun run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
