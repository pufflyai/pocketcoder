name: ci

on:
  pull_request:
  workflow_call:

permissions: {}

env:
  BUN_VERSION: 1.4.2

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint, format-check, and detect unused code
        run: bun run check
      - run: bun run typecheck
      - name: Test reusable harness E2E contract
        run: bun run example:test
      - name: Validate the Pi and AgentAPI E2E fixture
        working-directory: examples/harnesses/pi
        run: |
          bun run typecheck
          bun test
      - name: Run Pi through AgentAPI full-stack E2E and pcd doctor
        run: bun run example:e2e:pi
      - name: Run Pi automatic resume full-stack E2E
        run: bun run example:pi:resume:check
      - name: Validate the Codex and OpenCode AgentAPI fixtures
        working-directory: examples/harnesses/oss
        run: |
          bun run typecheck
          bun test
      - name: Run Codex and OpenCode through AgentAPI full-stack E2E
        run: bun run example:e2e:oss
      - name: Verify private Docker egress config admission
        env:
          POCKETCODER_EGRESS_CONFORMANCE_IMAGE: ghcr.io/pufflyai/pocketcoder/egress@sha256:d94d1336f9aad317adc06f2cdb24082915efc1f654ead5e1baced06e72c39b29
        run: |
          docker pull --platform linux/amd64 "$POCKETCODER_EGRESS_CONFORMANCE_IMAGE"
          bun test packages/drivers/src/docker/docker-egress-conformance.test.ts
      - name: Unit, route, e2e, and PGlite integration tests
        run: bun run test
      - name: Build all entrypoints
        run: bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Validate publishable packages
        run: bun run pack:check

  embedded-database:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Disk locking, durable recovery and compiled assets
        run: bun test packages/db/src/database/crash.test.ts packages/db/src/database/pglite.test.ts packages/db/src/migrations/migrator.test.ts packages/db/src/migrations/crash.test.ts
