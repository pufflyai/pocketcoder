name: ci
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  merge_group: null
  push:
    branches:
      - main
      - feature/pocketcoder-1-0
  schedule:
    - cron: 23 3 * * *
  workflow_dispatch:
    inputs:
      full:
        description: Run complete qualification on this revision
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
  NX_LOAD_DOT_ENV_FILES: "false"
  NX_DAEMON: "false"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      projects: ${{ steps.plan.outputs.projects }}
      hasProjects: ${{ steps.plan.outputs.hasProjects }}
      smoke: ${{ steps.plan.outputs.smoke }}
      postmerge: ${{ steps.plan.outputs.postmerge }}
      required: ${{ steps.plan.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache: plan
      - id: plan
        env:
          CI_FULL: ${{ inputs.full || contains(github.event.pull_request.labels.*.name, 'full-ci') || false }}
        run: bun --no-env-file scripts/ci/plan.ts
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
        with:
          cache: quality
      - run: bun run check
      - run: bun run check-licenses
      - run: bun run ci:test
      - uses: ./.github/actions/save-cache
        with:
          cache: quality
          nx-hit: ${{ steps.setup.outputs.nx-hit }}
          bun-hit: ${{ steps.setup.outputs.bun-hit }}
  types:
    needs: plan
    if: needs.plan.outputs.hasProjects == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
        with:
          cache: types
      - env:
          CI_PROJECTS: ${{ needs.plan.outputs.projects }}
        run: bun --no-env-file scripts/ci/run.ts typecheck
      - uses: ./.github/actions/save-cache
        with:
          cache: types
          nx-hit: ${{ steps.setup.outputs.nx-hit }}
          bun-hit: ${{ steps.setup.outputs.bun-hit }}
  units:
    needs: plan
    if: needs.plan.outputs.hasProjects == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
        with:
          cache: unit-${{ matrix.shard }}
      - name: Prepare and verify the Kubernetes client
        if: contains(fromJSON(needs.plan.outputs.projects), '@pstdio/pocketcoder-manager')
        run: |
          timeout 30s cat "$(command -v kubectl)" > /dev/null
          timeout 30s kubectl version --client --output=json
      - name: Run affected unit and route tests
        env:
          CI_PROJECTS: ${{ needs.plan.outputs.projects }}
          CI_SHARD: ${{ matrix.shard }}
        run: bun --no-env-file scripts/ci/run.ts unit
      - uses: ./.github/actions/save-cache
        with:
          cache: unit-${{ matrix.shard }}
          nx-hit: ${{ steps.setup.outputs.nx-hit }}
          bun-hit: ${{ steps.setup.outputs.bun-hit }}
  smoke:
    needs: plan
    if: needs.plan.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: smoke
      - name: Run a real local echo workspace
        run: bun run example:e2e:local
  full:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    uses: ./.github/workflows/ci-full.yml
  build:
    needs:
      - plan
      - quality
      - types
      - units
      - smoke
    if: always() && needs.plan.outputs.postmerge == 'true' && needs.quality.result == 'success' && (needs.types.result ==
      'success' || needs.types.result == 'skipped') && (needs.units.result == 'success' || needs.units.result ==
      'skipped') && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped')
    uses: ./.github/workflows/ci-packages.yml
  checks:
    name: CI
    if: always()
    needs:
      - plan
      - quality
      - types
      - units
      - smoke
      - full
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Require every selected validation job to pass
        env:
          CI_REQUIRED: ${{ needs.plan.outputs.required }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: bun --no-env-file scripts/ci/gate.ts
run-name: "CI ${{ (inputs.full || contains(github.event.pull_request.labels.*.name, 'full-ci') || github.event_name ==
  'merge_group' || github.event_name == 'schedule') && 'full' || 'fast' }}: ${{ github.event.pull_request.title ||
  github.ref_name }}"
