name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions: {}

env:
  BUN_VERSION: 1.3.14

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pocketcoder
          POSTGRES_PASSWORD: pocketcoder
          POSTGRES_DB: pocketcoder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pocketcoder"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint, format-check, and detect unused code
        run: bun run check
      - run: bun run typecheck
      - name: Test reusable harness E2E contract
        run: bun run example:test
      - name: Validate the Pi and AgentAPI E2E fixture
        working-directory: examples/harnesses/pi
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
      - name: Validate the local Pi AgentAPI client
        working-directory: examples/clients/pi
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
      - name: Run Pi through AgentAPI full-stack E2E
        run: bun run example:e2e:pi
      - name: Unit, route, e2e, and PostgreSQL integration tests
        run: bun run test
        env:
          POCKETCODER_TEST_DATABASE_URL: postgres://pocketcoder:pocketcoder@127.0.0.1:5432/pocketcoder
      - name: Build all entrypoints
        run: bun run build

  images:
    # Publish on pushes to main and version tags only; PRs just build-test.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      server-digest: ${{ steps.server-build.outputs.digest }}
      workspace-digest: ${{ steps.workspace-build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Bundle the workspace supervisor for the workspace image
        run: |
          bun install --frozen-lockfile
          bun build apps/pocketcoder-agent/src/index.ts --target bun --outdir deploy/image/dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server image metadata
        id: server-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: Build and push server image
        id: server-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/image/server.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Workspace image metadata
        id: workspace-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/workspace
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: Build and push workspace image
        id: workspace-build
        uses: docker/build-push-action@v6
        with:
          context: deploy/image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.workspace-meta.outputs.tags }}
          labels: ${{ steps.workspace-meta.outputs.labels }}
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,scope=workspace,mode=max

      - name: Record published digests
        env:
          SERVER_DIGEST: ${{ steps.server-build.outputs.digest }}
          WORKSPACE_DIGEST: ${{ steps.workspace-build.outputs.digest }}
        run: |
          {
            echo "server=ghcr.io/${{ github.repository }}/server@${SERVER_DIGEST}"
            echo "workspace=ghcr.io/${{ github.repository }}/workspace@${WORKSPACE_DIGEST}"
          } | tee "$RUNNER_TEMP/pocketcoder-image-digests.txt"
          {
            echo "## Published image digests"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/pocketcoder-image-digests.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release-images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add image digests to tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SERVER_DIGEST: ${{ needs.images.outputs.server-digest }}
          WORKSPACE_DIGEST: ${{ needs.images.outputs.workspace-digest }}
        run: |
          {
            echo "server=ghcr.io/${{ github.repository }}/server@${SERVER_DIGEST}"
            echo "workspace=ghcr.io/${{ github.repository }}/workspace@${WORKSPACE_DIGEST}"
          } > "$RUNNER_TEMP/pocketcoder-image-digests.txt"
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          sed '/<!-- pocketcoder-image-digests -->/,$d' \
            "$RUNNER_TEMP/release-notes.md" > "$RUNNER_TEMP/release-notes-next.md"
          {
            echo
            echo "<!-- pocketcoder-image-digests -->"
            echo "## Container image digests"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/pocketcoder-image-digests.txt"
            echo '```'
          } >> "$RUNNER_TEMP/release-notes-next.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes-next.md"
          gh release upload "$TAG" \
            "$RUNNER_TEMP/pocketcoder-image-digests.txt#pocketcoder-image-digests.txt" \
            --clobber
