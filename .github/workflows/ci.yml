name: ci

on:
  pull_request:
  workflow_call:

permissions: {}

env:
  BUN_VERSION: 1.3.14

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pocketcoder
          POSTGRES_PASSWORD: pocketcoder
          POSTGRES_DB: pocketcoder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pocketcoder"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint, format-check, and detect unused code
        run: bun run check
      - run: bun run typecheck
      - name: Test reusable harness E2E contract
        run: bun run example:test
      - name: Validate the Pi and AgentAPI E2E fixture
        working-directory: examples/harnesses/pi
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
      - name: Run Pi through AgentAPI full-stack E2E
        run: bun run example:e2e:pi
      - name: Unit, route, e2e, and PostgreSQL integration tests
        run: bun run test
        env:
          POCKETCODER_TEST_DATABASE_URL: postgres://pocketcoder:pocketcoder@127.0.0.1:5432/pocketcoder
      - name: Build all entrypoints
        run: bun run build
