name: Managed-service qualification
on:
  workflow_call: {}
permissions:
  contents: read
env:
  BUN_VERSION: 1.4.2
  NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
  NX_LOAD_DOT_ENV_FILES: "false"
  NX_DAEMON: "false"
jobs:
  managed-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: managed-accounts
      - uses: ./.github/actions/load-fixtures
        with:
          fixture: service
      - name: Install the pinned kind release
        run: >
          curl -fsSLo "$RUNNER_TEMP/kind"
          https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64

          printf 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  %s\n' "$RUNNER_TEMP/kind" |
          sha256sum --check

          chmod 0755 "$RUNNER_TEMP/kind"

          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Create isolated accounts and run an echo workspace with enforced Calico
        run: bun run example:e2e:managed-accounts
  managed-accounts-cilium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: managed-accounts-cilium
      - uses: ./.github/actions/load-fixtures
        with:
          fixture: service
      - name: Install the pinned kind release
        run: >
          curl -fsSLo "$RUNNER_TEMP/kind"
          https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64

          printf 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  %s\n' "$RUNNER_TEMP/kind" |
          sha256sum --check

          chmod 0755 "$RUNNER_TEMP/kind"

          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install the pinned Helm release
        run: >
          curl -fsSLo "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz

          printf '86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  %s\n' "$RUNNER_TEMP/helm.tar.gz" |
          sha256sum --check

          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm

          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - name: Create isolated accounts and run an echo workspace with enforced Cilium
        run: bun run example:e2e:managed-accounts -- --cilium
  kind-private-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: kind-private-registry
      - uses: ./.github/actions/load-fixtures
        with:
          fixture: service
      - name: Install the pinned kind release
        run: |
          curl -fsSLo /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          printf 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind\n' | sha256sum --check
          chmod 0755 /tmp/kind
      - name: Prepare pinned cluster and registry images
        run: |
          docker pull kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          docker pull registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
      - name: Verify real kubelet private pulls and credential cleanup
        env:
          POCKETCODER_KIND_BIN: /tmp/kind
        run: bun run test:kind:registry
      - name: Verify private Git setup and revocation on both providers
        env:
          POCKETCODER_KIND_BIN: /tmp/kind
        run: bun run test:source:live
      - name: Verify renewable runtime authority on both providers
        env:
          POCKETCODER_KIND_BIN: /tmp/kind
        run: bun run test:runtime:live
  manager-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: manager-recovery
      - uses: ./.github/actions/load-fixtures
        with:
          fixture: service
      - name: Install the pinned kind release
        run: >
          curl -fsSLo "$RUNNER_TEMP/kind"
          https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64

          printf 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  %s\n' "$RUNNER_TEMP/kind" |
          sha256sum --check

          chmod 0755 "$RUNNER_TEMP/kind"

          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify independent manager journal and encrypted restore failures
        env:
          PC102_S3_TEST: "1"
          PC94_S3_TEST: "1"
        run: bun test packages/manager/src/recovery packages/manager/src/purge
      - name: Purge an account and restore the earlier manager backup
        env:
          POCKETCODER_E2E_WORKSPACE_IMAGE: pocketcoder-ci-workspace:${{ github.sha }}
        run: bun run example:e2e:manager-recovery
  managed-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: managed-upgrade
      - uses: ./.github/actions/load-fixtures
        with:
          fixture: service
      - name: Install the pinned kind release
        run: >
          curl -fsSLo "$RUNNER_TEMP/kind"
          https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64

          printf 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  %s\n' "$RUNNER_TEMP/kind" |
          sha256sum --check

          chmod 0755 "$RUNNER_TEMP/kind"

          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Upgrade accounts and recover faults without losing saved data
        env:
          POCKETCODER_E2E_WORKSPACE_IMAGE: pocketcoder-ci-workspace:${{ github.sha }}
        run: bun run example:e2e:managed-upgrade
      - name: Verify identical replies with the installed AgentAPI
        env:
          POCKETCODER_AGENTAPI_CONFORMANCE_IMAGE: pocketcoder-ci-workspace:${{ github.sha }}
        run: bun test deploy/image/agentapi.conformance.test.ts
  checks:
    name: Qualification result
    if: always()
    needs:
      - managed-accounts
      - managed-accounts-cilium
      - kind-private-registry
      - manager-recovery
      - managed-upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - env:
          CI_REQUIRED: '["managed-accounts","managed-accounts-cilium","kind-private-registry","manager-recovery","managed-upgrade"]'
          CI_RESULTS: ${{ toJSON(needs) }}
        run: bun --no-env-file scripts/ci/gate.ts
