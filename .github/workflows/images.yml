name: images
on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
  workflow_dispatch: {}
  push:
    tags:
      - v*
permissions:
  contents: read
  actions: read
env:
  BUN_VERSION: 1.4.2
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      server-digest: ${{ steps.server-build.outputs.digest }}
      workspace-digest: ${{ steps.workspace-build.outputs.digest }}
      egress-digest: ${{ steps.egress-build.outputs.digest }}
      publish: ${{ steps.revision.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify the exact successful CI revision
        id: revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_PUBLISH_BRANCH: main
        run: bun --no-env-file scripts/ci/publication.ts
      - name: Bundle the workspace supervisor for the workspace image
        run: |
          bun install --frozen-lockfile
          bun build packages/supervisor/src/index.ts --target bun --outdir deploy/image/dist
        if: steps.revision.outputs.publish == 'true'
      - uses: docker/setup-qemu-action@v3
        if: steps.revision.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.revision.outputs.publish == 'true'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: steps.revision.outputs.publish == 'true'
      - name: Server image metadata
        id: server-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |-
            type=raw,value=latest,enable=${{ steps.revision.outputs.latest }}
            type=raw,value=sha-${{ steps.revision.outputs.sha }}
            type=semver,pattern={{version}}
          labels: org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
        if: steps.revision.outputs.publish == 'true'
      - name: Build and push server image
        id: server-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/image/server.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
        if: steps.revision.outputs.publish == 'true'
      - name: Workspace image metadata
        id: workspace-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/workspace
          tags: |-
            type=raw,value=latest,enable=${{ steps.revision.outputs.latest }}
            type=raw,value=sha-${{ steps.revision.outputs.sha }}
            type=semver,pattern={{version}}
          labels: org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
        if: steps.revision.outputs.publish == 'true'
      - name: Build and push workspace image
        id: workspace-build
        uses: docker/build-push-action@v6
        with:
          context: deploy/image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.workspace-meta.outputs.tags }}
          labels: ${{ steps.workspace-meta.outputs.labels }}
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,scope=workspace,mode=max
        if: steps.revision.outputs.publish == 'true'
      - name: Egress image metadata
        id: egress-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/egress
          tags: |-
            type=raw,value=latest,enable=${{ steps.revision.outputs.latest }}
            type=raw,value=sha-${{ steps.revision.outputs.sha }}
            type=semver,pattern={{version}}
          labels: org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
        if: steps.revision.outputs.publish == 'true'
      - name: Build and push egress image
        id: egress-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/egress/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.egress-meta.outputs.tags }}
          labels: ${{ steps.egress-meta.outputs.labels }}
          cache-from: type=gha,scope=egress
          cache-to: type=gha,scope=egress,mode=max
        if: steps.revision.outputs.publish == 'true'
      - name: Record published digests
        env:
          SERVER_DIGEST: ${{ steps.server-build.outputs.digest }}
          WORKSPACE_DIGEST: ${{ steps.workspace-build.outputs.digest }}
          EGRESS_DIGEST: ${{ steps.egress-build.outputs.digest }}
        run: |
          {
            echo "server=ghcr.io/${{ github.repository }}/server@${SERVER_DIGEST}"
            echo "workspace=ghcr.io/${{ github.repository }}/workspace@${WORKSPACE_DIGEST}"
            echo "egress=ghcr.io/${{ github.repository }}/egress@${EGRESS_DIGEST}"
          } | tee "$RUNNER_TEMP/pocketcoder-image-digests.txt"
          {
            echo "## Published image digests"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/pocketcoder-image-digests.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        if: steps.revision.outputs.publish == 'true'
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion ==
      'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
  release-images:
    if: startsWith(github.ref, 'refs/tags/v') && needs.images.outputs.publish == 'true' &&
      needs.images.outputs.server-digest != '' && needs.images.outputs.workspace-digest != '' &&
      needs.images.outputs.egress-digest != ''
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add image digests to tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SERVER_DIGEST: ${{ needs.images.outputs.server-digest }}
          WORKSPACE_DIGEST: ${{ needs.images.outputs.workspace-digest }}
          EGRESS_DIGEST: ${{ needs.images.outputs.egress-digest }}
        run: |
          {
            echo "server=ghcr.io/${{ github.repository }}/server@${SERVER_DIGEST}"
            echo "workspace=ghcr.io/${{ github.repository }}/workspace@${WORKSPACE_DIGEST}"
            echo "egress=ghcr.io/${{ github.repository }}/egress@${EGRESS_DIGEST}"
          } > "$RUNNER_TEMP/pocketcoder-image-digests.txt"
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          sed '/<!-- pocketcoder-image-digests -->/,$d' \
            "$RUNNER_TEMP/release-notes.md" > "$RUNNER_TEMP/release-notes-next.md"
          {
            echo
            echo "<!-- pocketcoder-image-digests -->"
            echo "## Container image digests"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/pocketcoder-image-digests.txt"
            echo '```'
          } >> "$RUNNER_TEMP/release-notes-next.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes-next.md"
          gh release upload "$TAG" \
            "$RUNNER_TEMP/pocketcoder-image-digests.txt#pocketcoder-image-digests.txt" \
            --clobber
concurrency:
  group: main-image-publication
  cancel-in-progress: false
