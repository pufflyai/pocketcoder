name: candidate images
on:
  workflow_dispatch:
    inputs:
      operator-release:
        description: Build and publish only the tested synthetic operator bundle
        type: boolean
        default: false
      native-diagnostics:
        description: Run isolated native startup diagnostics without image builds or publication
        type: boolean
        default: false
      affected-startup-diagnostics:
        description: Diagnose first instrumented Linux x64 and ARM startup without acceptance or publication
        type: boolean
        default: false
      normal-startup-diagnostics:
        description: Diagnose original Linux artifacts with version prelude and one start without publication
        type: boolean
        default: false
permissions: {}
env:
  BUN_VERSION: 1.4.2
  CANDIDATE_COMMIT: ${{ github.sha }}
jobs:
  test:
    if: github.event_name != 'pull_request' && !inputs.operator-release && !inputs.native-diagnostics &&
      !inputs.affected-startup-diagnostics && !inputs.normal-startup-diagnostics
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      full: true
  diagnostics:
    if: (inputs.native-diagnostics || inputs.affected-startup-diagnostics) && !inputs.normal-startup-diagnostics
    permissions:
      contents: read
    uses: ./.github/workflows/native-startup-diagnostic.yml
    with:
      affected-only: ${{ inputs.affected-startup-diagnostics || false }}
  normal-startup-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.normal-startup-diagnostics
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-normal-startup-diagnostic.yml
  publish:
    if: github.event_name != 'pull_request' && !inputs.native-diagnostics && !inputs.affected-startup-diagnostics &&
      !inputs.normal-startup-diagnostics
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: pocketcoder-image-*-${{ env.CANDIDATE_COMMIT }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated archives under candidate-only tags
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: bun run images:publish "$RUNNER_TEMP/images" "$CANDIDATE_COMMIT" "$IMAGE_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: pocketcoder-candidate-image-digests-${{ env.CANDIDATE_COMMIT }}
          path: ${{ runner.temp }}/images/published.json
          if-no-files-found: error
  operator-release:
    if: github.event_name == 'workflow_dispatch' && inputs.operator-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Test the extracted release outside the source checkout
        run: bun test deploy/digitalocean/production
      - name: Build the exact committed operator release
        run: bun run operator:bundle "$RUNNER_TEMP/operator"
      - uses: actions/upload-artifact@v4
        with:
          name: pocketcoder-operator-${{ github.sha }}
          path: ${{ runner.temp }}/operator
          if-no-files-found: error
      - name: Publish the checksum-pinned synthetic operator candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          tag="operator-candidate-$GITHUB_SHA"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" --pattern operator.json --dir "$RUNNER_TEMP/previous"
            bun -e 'const a=await Bun.file(process.argv[1]).json(); const b=await Bun.file(process.argv[2]).json(); if(a.commit!==b.commit || a.sha256!==b.sha256) throw new Error("Existing candidate differs; refuse overwrite.");' "$RUNNER_TEMP/previous/operator.json" "$RUNNER_TEMP/operator/operator.json"
          else
            gh release create "$tag" "$RUNNER_TEMP/operator/operator.tar.gz" "$RUNNER_TEMP/operator/operator.json" \
              --target "$GITHUB_SHA" --prerelease --title "Operator candidate $GITHUB_SHA" \
              --notes "Checksum-pinned operator bundle for synthetic deployment and recovery validation."
          fi
concurrency:
  group: candidate-images-${{ github.ref }}
  cancel-in-progress: true
