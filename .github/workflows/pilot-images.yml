name: synthetic pilot images
on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      matrix:
        include:
          - name: manager
            context: .
            file: deploy/image/manager.Dockerfile
          - name: server
            context: .
            file: deploy/image/server.Dockerfile
          - name: workspace
            context: deploy/image
            file: deploy/image/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify the exact successful CI revision
        id: revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_PUBLISH_BRANCH: feature/pocketcoder-1-0
        run: bun --no-env-file scripts/ci/publication.ts
      - name: Bundle workspace supervisor
        if: steps.revision.outputs.publish == 'true' && (matrix.name == 'workspace')
        run: |
          bun install --frozen-lockfile
          bun build packages/supervisor/src/index.ts --target bun --outdir deploy/image/dist
      - uses: docker/setup-buildx-action@v3
        if: steps.revision.outputs.publish == 'true'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: steps.revision.outputs.publish == 'true'
      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:pilot-${{ github.event.workflow_run.head_sha || github.sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=pilot-${{ matrix.name }}
          cache-to: type=gha,scope=pilot-${{ matrix.name }},mode=max
        if: steps.revision.outputs.publish == 'true'
      - name: Record immutable image and source
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          printf '%s@%s\nsource=%s\n' "$IMAGE" "$DIGEST" "$SOURCE_SHA" > "$RUNNER_TEMP/${{ matrix.name }}.txt"
          cat "$RUNNER_TEMP/${{ matrix.name }}.txt" >> "$GITHUB_STEP_SUMMARY"
        if: steps.revision.outputs.publish == 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-${{ matrix.name }}-${{ github.event.workflow_run.head_sha || github.sha }}
          path: ${{ runner.temp }}/${{ matrix.name }}.txt
        if: steps.revision.outputs.publish == 'true'
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/pocketcoder-1-0') || (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'feature/pocketcoder-1-0' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
concurrency:
  group: pilot-publication
  cancel-in-progress: false
