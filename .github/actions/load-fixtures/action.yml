name: Load images built from this validation revision
description: Verify archive hashes, source revision, and Docker image IDs before reuse.
inputs:
  fixture:
    description: workspace, service, pi, or oss
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      if: inputs.fixture == 'workspace' || inputs.fixture == 'service'
      with:
        name: ci-fixture-workspace-${{ github.sha }}
        path: ${{ runner.temp }}/ci-fixtures
    - uses: actions/download-artifact@v4
      if: inputs.fixture == 'service'
      with:
        name: ci-fixture-server-${{ github.sha }}
        path: ${{ runner.temp }}/ci-fixtures
    - uses: actions/download-artifact@v4
      if: inputs.fixture == 'pi' || inputs.fixture == 'oss'
      with:
        name: ci-fixture-${{ inputs.fixture }}-${{ github.sha }}
        path: ${{ runner.temp }}/ci-fixtures
    - run: bun --no-env-file scripts/ci/fixtures.ts load "$RUNNER_TEMP/ci-fixtures"
      shell: bash
    - run: echo "POCKETCODER_CI_IMAGE_MANIFEST=$RUNNER_TEMP/ci-fixtures/manifest" >> "$GITHUB_ENV"
      shell: bash
